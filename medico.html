<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Agenda médica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-sistema">
        <div class="header-logo"><img src="logo.png" alt="Logo">
            <div><h2>Caja Nacional de Salud</h2><p>Agenda personal del médico</p></div>
        </div>
        <nav><a href="index.html" onclick="cerrarSesion()">Salir</a></nav>
    </header>
    <main class="contenedor">
        <section class="titulo-pagina">
            <h1 id="tituloAgendaMedica">Mi agenda médica</h1>
            <p>Consulta tus pacientes y actualiza el estado de cada ficha directamente.</p>
        </section>
        <section class="panel-control">
            <div id="resumenPanel"></div>
            <label for="buscarCita">Buscar por paciente o número de ficha</label>
            <input id="buscarCita" type="search" placeholder="Buscar paciente">
            <label for="filtroEstado">Filtrar por estado</label>
            <select id="filtroEstado">
                <option value="">Todos los estados</option>
                <option>Pendiente</option>
                <option>Realizado (Atendido)</option>
                <option>Cancelado</option>
                <option>Sin asistencia</option>
            </select>
        </section>
        <div class="tabla-contenedor">
            <table>
                <thead><tr><th>Ficha</th><th>Paciente</th><th>CI</th><th>Fecha</th><th>Hora</th><th>Especialidad</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tablaPanel"></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="panel.js"></script>
</body>
</html>
