<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Administración de citas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-sistema">
        <div class="header-logo"><img src="logo.png" alt="Logo">
            <div><h2>Caja Nacional de Salud</h2><p>Administración y control de fichas</p>
                <p id="bienvenidaUsuario" class="saludo-usuario" aria-live="polite"></p></div>
        </div>
        <nav><a href="index.html" onclick="cerrarSesion()">Salir</a></nav>
    </header>
    <main class="contenedor">
        <section class="titulo-pagina">
            <h1>Administración de citas</h1>
            <p>Consulta las fichas y administra los cupos disponibles.</p>
        </section>
        <section class="panel-control">
            <div id="resumenPanel"></div>
            <label for="buscarCita">Buscar por paciente, médico o número de ficha</label>
            <input id="buscarCita" type="search" placeholder="Buscar cita">
            <label for="filtroEstado">Filtrar por estado</label>
            <select id="filtroEstado">
                <option value="">Todos los estados</option>
                <option>Pendiente</option>
                <option>Realizado (Atendido)</option>
                <option>Cancelado</option>
                <option>Sin asistencia</option>
            </select>
        </section>
        <section class="panel-control" aria-labelledby="tituloCupos">
            <h2 id="tituloCupos" style="width:100%">Configurar cupos de fichas</h2>
            <label for="cupoEspecialidad">Especialidad</label><select id="cupoEspecialidad"></select>
            <label for="cupoFecha">Fecha</label><input id="cupoFecha" type="date">
            <label for="cupoLimite">Cantidad máxima de fichas</label><input id="cupoLimite" type="number" min="0" step="1" placeholder="Ej. 10">
            <button id="guardarCupo" type="button" class="boton-accion">Guardar cupo</button>
            <button id="quitarCupo" type="button" class="boton-accion">Sin límite</button>
            <p id="estadoCupo" role="status" style="width:100%"></p>
        </section>
        <div class="tabla-contenedor">
            <table>
                <thead><tr><th>Ficha</th><th>Paciente</th><th>CI</th><th>Fecha</th><th>Hora</th><th>Médico</th><th>Especialidad</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody id="tablaPanel"></tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
    <script src="panel.js"></script>
</body>
</html>
